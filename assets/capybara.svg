<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Capybara in a sunny meadow</title>
  <desc id="desc">A gentle illustrated capybara sitting in a grassy meadow beside a pond, with reeds, flowers and soft clouds.</desc>
  <defs>
