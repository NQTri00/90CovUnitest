<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">Capybara beside a pond</title>
<desc id="desc">A naturalistic, richly textured capybara resting in a sunlit meadow beside a quiet pond.</desc>
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#8eb8bd"/><stop offset=".58" stop-color="#d5d9bd"/><stop offset="1" stop-color="#e9d9b7"/></linearGradient>
  <linearGradient id="hills" x2="0" y2="1"><stop stop-color="#78916b"/><stop offset="1" stop-color="#415d43"/></linearGradient>
  <linearGradient id="water" x2="0" y2="1"><stop stop-color="#9bb8ad"/><stop offset=".5" stop-color="#688f87"/><stop offset="1" stop-color="#405f5b"/></linearGradient>
  <radialGradient id="sunlight"><stop stop-color="#fff3d0" stop-opacity=".75"/><stop offset="1" stop-color="#fff3d0" stop-opacity="0"/></radialGradient>
  <linearGradient id="body" x1=".1" y1=".05" x2=".8" y2="1"><stop stop-color="#bd9167"/><stop offset=".28" stop-color="#a97952"/><stop offset=".66" stop-color="#875b3f"/><stop offset="1" stop-color="#60432f"/></linearGradient>
  <linearGradient id="bodyLight" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#d2a77c"/><stop offset=".5" stop-color="#b78960"/><stop offset="1" stop-color="#765039"/></linearGradient>
  <linearGradient id="head" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#c19369"/><stop offset=".55" stop-color="#9a6c49"/><stop offset="1" stop-color="#694831"/></linearGradient>
  <linearGradient id="muzzle" x2=".25" y2="1"><stop stop-color="#d8b18a"/><stop offset="1" stop-color="#a97b57"/></linearGradient>
  <radialGradient id="nose"><stop stop-color="#55483d"/><stop offset=".7" stop-color="#302b26"/><stop offset="1" stop-color="#171918"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="fur" x="-15%" y="-15%" width="130%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="8" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono" result="grain"><feFuncA type="table" tableValues="0 .23"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="grain" mode="soft-light"/>
  </filter>
  <clipPath id="bodyClip"><path d="M292 812 C300 710 355 623 466 581 C566 542 718 560 806 633 C871 686 904 783 865 865 C834 930 748 970 625 976 C497 983 365 948 315 887 C298 866 289 839 292 812Z"/></clipPath>
  <clipPath id="headClip"><path d="M715 628 C732 566 792 522 864 520 C932 518 987 563 1005 625 C1020 681 1001 741 956 775 C918 805 854 802 800 775 C746 748 700 692 715 628Z"/></clipPath>
</defs>

<rect width="1200" height="1200" fill="url(#sky)"/>
<circle cx="930" cy="190" r="245" fill="url(#sunlight)"/>
<circle cx="930" cy="190" r="64" fill="#f5dfad" opacity=".72"/>
<g fill="#f4f0df" opacity=".3" filter="url(#blur)">
  <ellipse cx="245" cy="250" rx="155" ry="38"/><ellipse cx="315" cy="235" rx="95" ry="48"/>
  <ellipse cx="710" cy="320" rx="125" ry="30"/>
</g>
