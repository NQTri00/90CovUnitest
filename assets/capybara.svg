 <path d="M440 1040 Q560 1020 655 1039 M900 958 Q965 948 1030 961" stroke="#b6cfc0" stroke-width="3"/>
</g>

<ellipse cx="580" cy="1000" rx="320" ry="65" fill="#172b22" opacity=".36" filter="url(#blur)"/>
