<path d="M0 875 Q220 780 430 844 T850 819 T1200 830 V1200 H0Z" fill="url(#hills)"/>
<g opacity=".38" fill="#c2c89b" filter="url(#blur)"><ellipse cx="230" cy="700" rx="230" ry="55"/><ellipse cx="1000" cy="730" rx="230" ry="60"/></g>

<path d="M35 880 Q205 812 382 852 Q532 887 670 842 Q843 782 1128 850 Q1080 1008 895 1070 Q635 1150 355 1084 Q116 1028 35 880Z" fill="url(#water)"/>
