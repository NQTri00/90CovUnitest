      <stop offset="1" stop-color="#8d5c3f"/>
    </linearGradient>
    <linearGradient id="water" x2="0" y2="1">
      <stop stop-color="#8fc9bd"/>
      <stop offset="1" stop-color="#579d91"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

